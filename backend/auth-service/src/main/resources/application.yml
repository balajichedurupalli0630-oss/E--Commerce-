server:
  port: 8003

spring:
  application:
    name: auth-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094,localhost:9095,localhost:9096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET:omnicart-production-grade-jwt-secret-key-256-bit-minimum-security-standard}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
